services:
  db:
    image: mcr.microsoft.com/azure-sql-edge
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in backend/.env (see .env.example)}"
    ports:
      # Bound to localhost only so the database is not exposed on your network
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    build: .
    depends_on:
      - db
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "mssql+pyodbc://sa:${MSSQL_SA_PASSWORD}@db:1433/canwell?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"

volumes:
  sqlserver_data:
